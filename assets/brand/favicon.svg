<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 91" width="109" height="91">
  <style>
    @media (prefers-color-scheme: dark) {
      .icon-dark { display: none; }
      .icon-light { display: block; }
    }
    @media (prefers-color-scheme: light) {
      .icon-dark { display: block; }
      .icon-light { display: none; }
    }
  </style>
  <image class="icon-dark" href="data:image/png;base64," width="109" height="91" />
  <image class="icon-light" href="data:image/png;base64," width="109" height="91" style="display:none;" />
</svg>